name: Odds Update

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Snapshot phase'
        required: true
        default: 'manual'
        type: choice
        options:
          - opening
          - pre_game
          - late
          - manual
  schedule:
    # 8 slots/day in HKT, 2 markets each (spreads + totals) = 16 credits/day = 496/month.
    # All times in UTC. HKT comments are for reference only.
    - cron: '30 16 * * *'   # HKT 00:30 (prev day) → opening
    - cron: '0 19 * * *'    # HKT 03:00 (prev day) → pre_game
    - cron: '0 23 * * *'    # HKT 07:00 (prev day) → pre_game
    - cron: '30 0 * * *'    # HKT 08:30 → pre_game
    - cron: '30 1 * * *'    # HKT 09:30 → pre_game
    - cron: '30 2 * * *'    # HKT 10:30 → pre_game
    - cron: '30 3 * * *'    # HKT 11:30 → pre_game
    - cron: '0 8 * * *'     # HKT 16:00 → closing

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    env:
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Determine phase from cron
        id: phase
        run: |
          # Manual run uses input; scheduled runs derive from current UTC hour:minute
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.phase }}" >> "$GITHUB_OUTPUT"
          else
            HM=$(date -u +%H%M)
            case "$HM" in
              1630) echo "value=opening"   >> "$GITHUB_OUTPUT" ;;
              0800) echo "value=closing"     >> "$GITHUB_OUTPUT" ;;
              1900|2300|0030|0130|0230|0330) echo "value=pre_game" >> "$GITHUB_OUTPUT" ;;
              *)    echo "value=manual"   >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run odds fetch (spreads + totals only — moneyline dropped to fit 500 cred/mo budget)
        run: python -m scripts.run odds --phase ${{ steps.phase.outputs.value }} --markets spreads,totals

      - name: Verify DB modified
        run: |
          if [ ! -f data/nba.db ]; then
            echo "::error::data/nba.db missing after odds run"
            exit 1
          fi
          ls -la data/

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/nba.db
          if git diff --staged --quiet; then
            echo "No changes — skipping commit."
          else
            git commit -m "Odds update: ${{ steps.phase.outputs.value }} $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3; do
              if git push; then
                echo "Pushed on attempt $i"
                exit 0
              fi
              echo "Push failed (attempt $i), pulling + retrying..."
              git pull --rebase --strategy-option=theirs
              sleep $((i * 3))
            done
            echo "::error::Failed to push after 3 attempts"
            exit 1
          fi
