name: ESPN Update

on:
  workflow_dispatch:
  schedule:
    # Every hour, all UTC. Catches morning/midday/evening status updates.
    - cron: '0 * * * *'

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch ESPN data
        run: |
          set -e  # exit on any error
          python -m scripts.run espn 2>&1 | tee /tmp/espn-output.log
          # If the previous command exited 0 but printed an error, also fail
          if grep -qi "fetch failed\|traceback" /tmp/espn-output.log; then
            echo "::error::ESPN fetch reported errors"
            exit 1
          fi
