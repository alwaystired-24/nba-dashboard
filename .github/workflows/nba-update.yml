name: NBA Update

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - backfill
#  schedule:
#    # 09:00 UTC = 17:00 Hong Kong time = after all NBA games have ended
#    # Note: launchd on Eddy's Mac runs the daily job locally at 09:00 HKT,
#    # so this schedule is disabled. Re-enable if local job becomes unreliable.
#    - cron: '0 9 * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seed teams (idempotent)
        run: python -m scripts.run init

      - name: Run ETL
        run: python -m scripts.run ${{ github.event.inputs.mode || 'daily' }}

      - name: Show status
        run: python -m scripts.run status
